name: echoes

x-app-env: &app-env
  DATABASE_URL: postgres://echoes:echoes@db:5432/echoes
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: echoes
  S3_SECRET_KEY: echoes-secret
  S3_BUCKET: echoes
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
  ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me}

services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: echoes
      POSTGRES_PASSWORD: echoes
      POSTGRES_DB: echoes
    ports: ["5433:5432"]
    volumes: [db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U echoes"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis:/data]

  # S3-compatible object storage (SeaweedFS; MinIO no longer publishes public images).
  minio:
    image: chrislusf/seaweedfs:latest
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-ip.bind=0.0.0.0"]
    ports: ["9000:8333"]
    volumes: [s3:/data]

  # Stateless HTTP API – scale with `docker compose up --scale api=3` behind a load balancer.
  api:
    profiles: [app]
    build: { context: .., dockerfile: infra/Dockerfile }
    command: ["pnpm", "--filter", "@echoes/api", "start"]
    environment: *app-env
    ports: ["3000:3000"]
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started }, minio: { condition: service_started } }

  # Queue consumers (GenAI + ingest) – scale independently of the API.
  worker:
    profiles: [app]
    build: { context: .., dockerfile: infra/Dockerfile }
    command: ["pnpm", "--filter", "@echoes/worker", "start"]
    environment: *app-env
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started }, minio: { condition: service_started } }

volumes:
  db: {}
  redis: {}
  s3: {}
